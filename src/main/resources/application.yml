spring:
  application:
    name: cms-complaints
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5445/cms_complaints_db}
    username: ${SPRING_DATASOURCE_USERNAME:chemical}
    password: ${SPRING_DATASOURCE_PASSWORD:chemical}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: cms-complaints
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8080/realms/chemical-platform}

server:
  port: ${SERVER_PORT:8080}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

cms:
  openapi:
    gateway-url: ${CMS_OPENAPI_GATEWAY_URL:http://localhost:8088}
  complaints:
    outbox:
      poll-interval-ms: ${CMS_COMPLAINTS_OUTBOX_POLL_INTERVAL_MS:5000}
      batch-size: ${CMS_COMPLAINTS_OUTBOX_BATCH_SIZE:50}
  kafka:
    topics:
      company-created: cms.company.created.v1
      premise-created: cms.premise.created.v1
      complaint-inspection-requested: cms.complaint.inspection.requested.v1
      complaint-submitted: cms.complaint.submitted.v1
      complaint-resolved: cms.complaint.resolved.v1

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    enabled: false

logging:
  level:
    com.nuvemite.cms.complaints: INFO
